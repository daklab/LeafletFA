[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafletfa"
version = "0.2.0"   # keep equal to leafletfa.__version__
description = "LeafletFA: a Dirichlet-multinomial factor model of single-cell splice-junction usage"
authors = [{name = "Karin Isaev", email = "karin.isaev@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core model
    "torch>=2.0",
    "pyro-ppl>=1.9",
    # Data format
    "anndata>=0.10",
    "scipy>=1.10",
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    # Waypoints and the legacy LeafletFA class (not part of the shipped model)
    "scanpy>=1.9",
    "umap-learn>=0.5",
    "scikit-learn>=1.2",
    # Utilities / visualization
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
# Triton kernel for the legacy LeafletFA class only (Linux, CUDA); the shipped model needs only torch
gpu = ["triton"]
# Experiment tracking
wandb = ["wandb"]

[project.urls]
Repository = "https://github.com/daklab/LeafletFA"

[tool.setuptools.packages.find]
where = ["."]
include = ["leafletfa*"]
